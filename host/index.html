<!DOCTYPE html>
<html lang="pt-BR" manifest="cache-v6.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d10">
<title>Tayson PS4 webkit</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0d10;color:#f5f7fa;font-family:Arial,Helvetica,sans-serif}
body{display:table;width:100%;height:100vh}
main{display:table-cell;vertical-align:middle;text-align:center;padding:24px}
.wrap{width:520px;max-width:92%;margin:0 auto}
h1{margin:0 0 10px;font-size:42px;font-weight:700;letter-spacing:-1px}
.sub{margin:0 0 30px;color:#7d8794;font-size:14px}
.status{padding:17px 18px;border:1px solid #242a31;border-radius:10px;background:#111419;font-size:15px;color:#cfd6df}
#fw{display:block;margin-top:7px;color:#4aa3ff;font-weight:700}
.line{width:56px;height:3px;margin:24px auto 0;border-radius:3px;background:#2c8cff}
.error{color:#ff6b75!important}
.success{color:#63d98b!important}
footer{margin-top:28px;color:#555f6b;font-size:12px}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <h1>Tayson PS4 webkit</h1>
    <p class="sub">Exploit Host</p>

    <div class="status">
      <span id="msg">Detectando firmware...</span>
      <span id="fw">Aguarde</span>
    </div>

    <div class="line"></div>
    <footer>Tayson</footer>
  </div>
</main>

<script>
var msg=document.getElementById('msg');
var fw=document.getElementById('fw');

function setStatus(text,version,cls){
  msg.innerHTML=text;
  fw.innerHTML=version||'';
  fw.className=cls||'';
}

var appCache=window.applicationCache;
if(appCache){
  appCache.addEventListener('updateready',function(){
    try{appCache.swapCache();}catch(e){}
    setTimeout(function(){location.reload();},400);
  },false);
}

var ua=navigator.userAgent;
var m=ua.match(/PlayStation 4[ \/](\d+)\.(\d+)/i);

document.addEventListener('DOMContentLoaded',function(){
  if(!m){
    setStatus('Este host foi feito para PS4.','Navegador não compatível','error');
    return;
  }

  var version=m[1]+'.'+m[2];
  var n=parseInt(m[1],10)*100+parseInt(m[2],10);

  if(n<=1202){
    setStatus('Firmware detectado','FW '+version,'success');
    setTimeout(function(){window.location.replace('run_lapse.html?bug=lapse');},1200);
    return;
  }

  if(n>=1250){
    setStatus('Firmware detectado','FW '+version,'success');
    setTimeout(function(){window.location.replace('run_poops.html?bug=poops');},1200);
    return;
  }

  setStatus('Firmware não suportado','FW '+version,'error');
},false);
</script>
</body>
</html>
