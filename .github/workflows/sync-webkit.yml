# source-release: 20260830-18
name: Sync Tayson WebKit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-webkit.yml"

permissions:
  contents: write

concurrency:
  group: sync-tayson-webkit
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout user site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Tayson source
        uses: actions/checkout@v4
        with:
          repository: itayson/tayson
          ref: main
          path: _tayson_source

      - name: Sync host to /webkit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf webkit
          mkdir -p webkit
          cp -a _tayson_source/host/. webkit/
          rm -rf _tayson_source
          touch .nojekyll

      - name: Commit published WebKit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webkit .nojekyll
          if git diff --cached --quiet; then
            echo "WebKit is already synchronized."
            exit 0
          fi
          git commit -m "Publish Tayson WebKit at /webkit [skip ci]"
          git push
