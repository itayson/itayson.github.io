name: Publish Eleicoes Brasil 2026

on:
  push:
    branches: [main]
    paths:
      - "eleicoes-brasil-2026-v3.0.0.zip.b64.part.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf eleicoes-brasil-2026 /tmp/eleicoes-site /tmp/eleicoes.zip
          mkdir -p /tmp/eleicoes-site
          cat eleicoes-brasil-2026-v3.0.0.zip.b64.part.* | base64 -d > /tmp/eleicoes.zip
          unzip -q /tmp/eleicoes.zip -d /tmp/eleicoes-site
          cp -a /tmp/eleicoes-site/eleicoes-brasil-2026 ./eleicoes-brasil-2026
      - name: Commit published source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eleicoes-brasil-2026
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Publish Eleicoes Brasil 2026 v3.0.0"
          git push
