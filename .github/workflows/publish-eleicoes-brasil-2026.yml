name: Publish Eleicoes Brasil 2026

on:
  push:
    branches: [main]
    paths:
      - "eleicoes-brasil-2026-standalone.ready"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble standalone site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eleicoes-brasil-2026
          cat eleicoes-brasil-2026-standalone.part.* > eleicoes-brasil-2026/index.html
          test "$(wc -c < eleicoes-brasil-2026/index.html)" -eq 108815
      - name: Commit published site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eleicoes-brasil-2026/index.html
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Publish Eleicoes Brasil 2026 v3.0.0"
          git push
