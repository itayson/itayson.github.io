<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08110f">
  <meta name="description" content="Painel independente para acompanhar a apuração das Eleições 2026 no Brasil com dados oficiais do TSE.">
  <title>Eleições Brasil 2026</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
:root {
  color-scheme: dark;
  --bg: #07100e;
  --panel: rgba(15, 29, 25, .80);
  --panel-solid: #0f1d19;
  --panel-2: #13231f;
  --text: #f2f7f5;
  --muted: #9aada6;
  --soft: #6f857d;
  --line: rgba(217, 239, 232, .12);
  --accent: #56d6a5;
  --blue: #6ea9ff;
  --warning: #f6c866;
  --danger: #ff8c91;
  --shadow: 0 24px 70px rgba(0,0,0,.22);
  --radius: 22px;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f6f4;
  --panel: rgba(255, 255, 255, .88);
  --panel-solid: #ffffff;
  --panel-2: #edf4f0;
  --text: #10211b;
  --muted: #60766e;
  --soft: #7f918b;
  --line: rgba(16, 33, 27, .12);
  --accent: #087f59;
  --blue: #226bd2;
  --warning: #9a6500;
  --danger: #b33c45;
  --shadow: 0 20px 60px rgba(31, 55, 46, .10);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 320px;
  background:
    radial-gradient(circle at 18% -8%, color-mix(in srgb, var(--accent) 15%, transparent), transparent 34%),
    radial-gradient(circle at 92% 8%, color-mix(in srgb, var(--blue) 11%, transparent), transparent 30%),
    var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.4;
}
button, select, input { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.skip-link { position: fixed; left: 12px; top: -60px; z-index: 100; padding: 10px 14px; border-radius: 10px; background: var(--text); color: var(--bg); }
.skip-link:focus { top: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.hidden { display: none !important; }

.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 16px clamp(18px, 4vw, 64px);
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: blur(18px);
}
.brand-wrap { display: flex; align-items: center; gap: 12px; }
.brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--blue)); color: #06100d; font-weight: 950; letter-spacing: -.04em; }
.brand-wrap strong { display: block; font-size: 15px; }
.brand-wrap span { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
.top-actions { display: flex; align-items: center; gap: 10px; }
.icon-button, .tse-link, .secondary-button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 12px; }
.icon-button { width: 42px; height: 42px; }
.tse-link { padding: 10px 14px; text-decoration: none; font-size: 14px; font-weight: 750; }
.secondary-button { min-height: 42px; padding: 0 14px; font-weight: 800; }
.secondary-button:disabled { opacity: .55; cursor: wait; }

.shell { width: min(1240px, calc(100% - 32px)); margin: 0 auto; padding: 54px 0 36px; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 44px; align-items: end; margin-bottom: 28px; }
.eyebrow, .section-kicker { color: var(--accent); font-weight: 850; text-transform: uppercase; letter-spacing: .12em; font-size: 12px; }
.eyebrow { display: flex; align-items: center; gap: 9px; }
.live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 16%, transparent); }
.hero h1 { max-width: 820px; margin: 12px 0; font-size: clamp(38px, 7vw, 74px); line-height: .98; letter-spacing: -.055em; }
.hero p { max-width: 820px; margin: 0; color: var(--muted); font-size: clamp(16px, 2vw, 20px); line-height: 1.55; }
.hero-status { min-width: 230px; text-align: right; }
.hero-status strong { display: block; margin-top: 10px; font-size: 15px; }
.hero-status small { display: block; margin-top: 5px; color: var(--muted); }
.status-badge { display: inline-flex; align-items: center; padding: 7px 10px; border-radius: 999px; font-size: 12px; font-weight: 850; border: 1px solid var(--line); }
.status-badge.ok { color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, transparent); }
.status-badge.error { color: var(--danger); background: color-mix(in srgb, var(--danger) 11%, transparent); }
.status-badge.neutral { color: var(--muted); background: var(--panel); }

.card, .metric-card { border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(16px); box-shadow: var(--shadow); }
.card { border-radius: var(--radius); }
.controls { display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr)) auto; gap: 12px; padding: 16px; margin-bottom: 18px; }
.field { display: grid; gap: 7px; }
.field label { padding-left: 2px; color: var(--muted); font-size: 12px; font-weight: 850; text-transform: uppercase; letter-spacing: .08em; }
select, input[type="search"] { width: 100%; border: 1px solid var(--line); color: var(--text); background: var(--panel-solid); outline: none; transition: border-color .2s, box-shadow .2s; }
select { min-height: 46px; padding: 0 13px; border-radius: 12px; }
input[type="search"] { min-height: 44px; padding: 0 14px; border-radius: 12px; }
select:focus, input[type="search"]:focus { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 12%, transparent); }
.primary-button { align-self: end; min-height: 46px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent); color: #06100d; font-weight: 900; }
.primary-button:disabled { opacity: .55; cursor: wait; }
.primary-button.full { width: 100%; }
.notice { margin: 0 0 18px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; color: var(--warning); background: color-mix(in srgb, var(--warning) 8%, var(--panel)); }
.notice[data-type="error"] { color: var(--danger); }

.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 6px; margin-bottom: 16px; border: 1px solid var(--line); border-radius: 16px; background: color-mix(in srgb, var(--panel) 78%, transparent); }
.tab-button { flex: 0 0 auto; min-height: 40px; padding: 0 14px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); font-weight: 800; }
.tab-button.active { color: var(--text); background: var(--panel-solid); box-shadow: 0 6px 16px rgba(0,0,0,.08); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin: 18px 0; }
.metric-card { min-height: 154px; padding: 20px; border-radius: 18px; }
.metric-card > span { color: var(--muted); font-size: 13px; font-weight: 750; }
.metric-card strong { display: block; margin-top: 14px; font-size: clamp(25px, 4vw, 36px); letter-spacing: -.04em; }
.metric-card small { display: block; margin-top: 10px; color: var(--muted); line-height: 1.4; }
.progress { width: 100%; height: 8px; overflow: hidden; border-radius: 999px; background: color-mix(in srgb, var(--text) 8%, transparent); }
.metric-card .progress { margin-top: 12px; }
.progress-bar { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--blue)); transition: width .55s ease; }

.results { overflow: hidden; }
.section-head { display: flex; justify-content: space-between; gap: 28px; align-items: end; padding: 24px 24px 18px; border-bottom: 1px solid var(--line); }
.section-head.compact { align-items: center; }
.section-kicker { margin: 0 0 8px; }
.section-head h2, .info-card h2, .state-inspector h2 { margin: 0; letter-spacing: -.035em; }
.section-head h2 { font-size: clamp(26px, 4vw, 38px); }
.section-head p:last-child { margin: 7px 0 0; color: var(--muted); }
.search-box { display: block; width: min(320px, 42vw); }
.candidate-list { display: grid; }
.candidate-card { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 18px; padding: 20px 24px; border-bottom: 1px solid var(--line); }
.candidate-card:last-child { border-bottom: 0; }
.candidate-photo-wrap { position: relative; width: 88px; height: 88px; border-radius: 20px; overflow: hidden; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, var(--panel-solid)), color-mix(in srgb, var(--blue) 18%, var(--panel-solid))); }
.candidate-photo, .candidate-placeholder { position: absolute; inset: 0; width: 100%; height: 100%; }
.candidate-photo { object-fit: cover; z-index: 2; }
.candidate-placeholder { display: grid; place-items: center; font-weight: 900; color: var(--muted); }
.candidate-heading { display: flex; align-items: start; justify-content: space-between; gap: 16px; }
.candidate-meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-bottom: 7px; }
.candidate-number, .candidate-party { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 900; }
.candidate-number { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
.candidate-party { background: color-mix(in srgb, var(--blue) 12%, transparent); color: var(--blue); }
.candidate-name { margin: 0; font-size: clamp(18px, 2.6vw, 24px); letter-spacing: -.025em; }
.candidate-vice { min-height: 18px; margin: 5px 0 0; color: var(--muted); font-size: 13px; }
.candidate-score { min-width: 120px; text-align: right; }
.candidate-score strong { display: block; font-size: clamp(23px, 4vw, 34px); letter-spacing: -.04em; }
.candidate-score span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
.candidate-progress { margin-top: 14px; height: 7px; }
.candidate-footer { display: flex; justify-content: space-between; gap: 14px; margin-top: 9px; color: var(--soft); font-size: 11px; }
.candidate-status[data-elected="true"] { color: var(--accent); font-weight: 900; }
.loading-state, .empty-state { padding: 52px 24px; text-align: center; color: var(--muted); }
.loading-state { display: grid; place-items: center; gap: 14px; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state strong { color: var(--text); }
.empty-state p { margin: 6px auto 0; max-width: 560px; }

.two-column-layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, .7fr); gap: 16px; }
.map-card { overflow: hidden; }
.map-wrap { padding: 14px 22px 24px; overflow: auto; }
.brazil-map { width: 100%; min-width: 620px; height: auto; overflow: visible; }
.map-state { cursor: pointer; outline: none; }
.map-state rect { fill: color-mix(in srgb, var(--panel-2) 94%, var(--accent)); stroke: var(--line); stroke-width: 2; transition: transform .16s, fill .16s, stroke .16s; transform-box: fill-box; transform-origin: center; }
.map-state text { fill: var(--text); font: 800 14px system-ui, sans-serif; pointer-events: none; }
.map-state:hover rect, .map-state:focus rect { transform: scale(1.08); stroke: var(--accent); }
.map-state.selected rect { stroke: var(--accent); stroke-width: 4; }
.map-state[data-level="v0"] rect { fill: var(--panel-2); }
.map-state[data-level="v1"] rect { fill: color-mix(in srgb, var(--accent) 16%, var(--panel-2)); }
.map-state[data-level="v2"] rect { fill: color-mix(in srgb, var(--accent) 28%, var(--panel-2)); }
.map-state[data-level="v3"] rect { fill: color-mix(in srgb, var(--accent) 42%, var(--panel-2)); }
.map-state[data-level="v4"] rect { fill: color-mix(in srgb, var(--accent) 58%, var(--panel-2)); }
.map-state[data-level="v5"] rect { fill: color-mix(in srgb, var(--accent) 78%, var(--panel-2)); }
.map-legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 14px 24px 0; color: var(--muted); font-size: 12px; }
.map-legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend-box { width: 18px; height: 10px; border-radius: 3px; display: inline-block; background: var(--panel-2); }
.legend-box.high { background: color-mix(in srgb, var(--accent) 78%, var(--panel-2)); }
.state-inspector { padding: 24px; align-self: start; position: sticky; top: 92px; }
.state-inspector h2 { margin-top: 8px; font-size: 30px; }
.inspector-meta { margin: 12px 0 18px; color: var(--muted); line-height: 1.55; }
.mini-ranking { display: grid; gap: 10px; margin-bottom: 18px; }
.mini-ranking > div { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 9px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--panel-solid) 70%, transparent); }
.mini-ranking > div > span { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: var(--panel-2); font-weight: 900; }
.mini-ranking p { margin: 0; min-width: 0; }
.mini-ranking strong, .mini-ranking small { display: block; }
.mini-ranking strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-ranking small { margin-top: 2px; color: var(--muted); }
.compare-card { margin-top: 16px; overflow: hidden; }
.inline-status { padding: 16px 24px; color: var(--muted); border-bottom: 1px solid var(--line); }
.state-comparison { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); }
.state-row { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 15px 18px; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: transparent; color: var(--text); text-align: left; }
.state-row:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.state-row > strong { font-size: 18px; }
.state-row b, .state-row small { display: block; }
.state-row small { margin-top: 3px; color: var(--muted); }
.state-progress-text { color: var(--muted); font-size: 12px; }
.error-row { color: var(--muted); }

.chart-card { overflow: hidden; margin-bottom: 16px; }
.chart-shell { position: relative; min-height: 320px; padding: 18px 18px 10px; }
.chart-shell canvas { display: block; width: 100%; max-width: 100%; }
.chart-empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center; color: var(--muted); pointer-events: none; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 14px 24px 0; color: var(--muted); font-size: 12px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 7px; }
.chart-legend i { width: 20px; height: 3px; border-radius: 99px; display: inline-block; }

.elected-card { overflow: hidden; }
.elected-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 18px; }
.elected-item { padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel-solid); }
.elected-item .elected-badge { display: inline-flex; padding: 5px 8px; margin-bottom: 12px; border-radius: 999px; color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, transparent); font-size: 10px; font-weight: 900; letter-spacing: .1em; }
.elected-item small, .elected-item strong, .elected-item > span:last-child { display: block; }
.elected-item small { color: var(--muted); }
.elected-item strong { margin: 4px 0 7px; font-size: 20px; }
.elected-item > span:last-child { color: var(--muted); font-size: 13px; }

.info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
.info-card { padding: 22px; }
.info-card h2 { font-size: 21px; }
.info-card p:last-child { margin: 10px 0 0; color: var(--muted); line-height: 1.6; font-size: 14px; }
.footer { width: min(1240px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 40px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 20px; color: var(--muted); font-size: 13px; }
.footer strong { display: block; color: var(--text); }
.footer span { display: block; margin-top: 4px; }
.footer > div:last-child { display: flex; flex-wrap: wrap; gap: 16px; }

@media (max-width: 1100px) {
  .controls { grid-template-columns: repeat(3, minmax(150px, 1fr)); }
  .two-column-layout { grid-template-columns: 1fr; }
  .state-inspector { position: static; }
  .elected-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; gap: 22px; }
  .hero-status { text-align: left; }
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
  .info-grid { grid-template-columns: 1fr; }
  .state-comparison { grid-template-columns: 1fr; }
}
@media (max-width: 680px) {
  .topbar { padding-inline: 16px; }
  .brand-wrap span, .tse-link, #connectionBadge { display: none; }
  .shell { width: min(100% - 20px, 1240px); padding-top: 34px; }
  .hero h1 { font-size: 43px; }
  .controls { grid-template-columns: 1fr; }
  .summary-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .metric-card { min-height: 134px; padding: 16px; }
  .metric-card strong { font-size: 27px; }
  .section-head { align-items: stretch; flex-direction: column; padding: 20px 16px 14px; }
  .search-box { width: 100%; }
  .candidate-card { grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 16px; }
  .candidate-photo-wrap { width: 64px; height: 64px; border-radius: 16px; }
  .candidate-heading { display: block; }
  .candidate-score { margin-top: 12px; text-align: left; }
  .candidate-score strong, .candidate-score span { display: inline; }
  .candidate-score span { margin-left: 8px; }
  .
